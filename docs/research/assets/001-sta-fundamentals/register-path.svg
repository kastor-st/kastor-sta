<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Register-to-register timing path</title>
  <desc id="desc">CLK feeds U_L/CK and U_C/CK. The selected timing path begins at U_L/CK, follows its internal clock-to-Q timing arc, then passes from U_L/Q through inverter U_INV and buffer U_BUF to endpoint U_C/D. The capture clock is a separate timing reference.</desc>
  <defs>
    <marker id="data-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#166534"/></marker>
  </defs>
  <rect width="1120" height="470" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#172033">
    <text x="36" y="38" font-size="24" font-weight="bold">Register-to-register timing path</text>
    <text x="36" y="66" font-size="16">One clock, rising-edge flip-flops, no timing exceptions; illustrative topology only</text>
    <rect x="150" y="125" width="150" height="175" rx="8" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
    <rect x="860" y="125" width="150" height="175" rx="8" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
    <text x="225" y="108" text-anchor="middle" font-size="18" font-weight="bold">U_L: launch register</text>
    <text x="935" y="108" text-anchor="middle" font-size="18" font-weight="bold">U_C: capture register</text>
    <text x="165" y="181" font-size="18">D</text><text x="277" y="155" font-size="18">Q</text>
    <text x="875" y="181" font-size="18">D</text><text x="986" y="181" font-size="18">Q</text>
    <text x="166" y="256" font-size="17">CK</text><text x="876" y="256" font-size="17">CK</text>
    <path d="M150 262 L163 270 L150 278 M860 262 L873 270 L860 278" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M180 270 L265 270 L265 175 L295 175" fill="none" stroke="#166534" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#data-arrow)"/>
    <text x="185" y="215" font-size="14" fill="#166534">CK-to-Q</text>
    <path d="M300 175 H420 M510 175 H620 M710 175 H860" fill="none" stroke="#166534" stroke-width="3" marker-end="url(#data-arrow)"/>
    <rect x="420" y="145" width="90" height="60" rx="4" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
    <rect x="620" y="145" width="90" height="60" rx="4" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
    <text x="465" y="132" text-anchor="middle" font-size="18" font-weight="bold">U_INV</text>
    <text x="665" y="132" text-anchor="middle" font-size="18" font-weight="bold">U_BUF</text>
    <text x="465" y="181" text-anchor="middle" font-size="16">NOT</text>
    <text x="665" y="181" text-anchor="middle" font-size="16">BUF</text>
    <text x="408" y="165" font-size="14">A</text><text x="515" y="165" font-size="14">Y</text>
    <text x="608" y="165" font-size="14">A</text><text x="715" y="165" font-size="14">Y</text>
    <text x="358" y="206" text-anchor="middle" font-size="15">U_L/Q</text>
    <text x="780" y="206" text-anchor="middle" font-size="15">U_C/D</text>
    <text x="780" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Endpoint</text>
    <text x="565" y="267" text-anchor="middle" font-size="16" fill="#166534">Selected external data route: Q to D</text>
    <path d="M60 355 H800 M110 355 V270 H150 M800 355 V270 H860" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="110" cy="355" r="4" fill="#1d4ed8"/>
    <text x="36" y="337" font-size="18" font-weight="bold" fill="#1d4ed8">CLK</text>
    <text x="165" y="325" font-size="16" font-weight="bold" fill="#166534">Startpoint: U_L/CK</text>
    <text x="540" y="337" font-size="16" fill="#1d4ed8">Capture clock branch to U_C/CK</text>
    <path d="M36 402 H86" stroke="#166534" stroke-width="3" marker-end="url(#data-arrow)"/>
    <text x="98" y="408" font-size="15">Data propagation</text>
    <path d="M305 402 H355" stroke="#166534" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="367" y="408" font-size="15">Internal timing arc (not a wire)</text>
    <path d="M680 402 H730" stroke="#1d4ed8" stroke-width="3"/>
    <text x="742" y="408" font-size="15">Clock connections</text>
    <text x="36" y="447" font-size="15" fill="#475569">Setup and hold compare data at U_C/D with clock arrival at U_C/CK. Shared CLK does not imply zero skew.</text>
  </g>
</svg>
